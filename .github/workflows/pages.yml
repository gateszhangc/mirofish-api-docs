name: Publish API docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate static files
        shell: bash
        run: |
          test -s index.html
          test -s api-guide.html
          test -s reference.html
          test -s openapi.yaml
          grep -q 'openapi:' openapi.yaml
          ! grep -Eiq 'mf_live_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}' --exclude-dir=.git .
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
